<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Daily Coach - Bài 6: Động từ chỉ sở thích + V-ing / to V</title>
</head>
<body>
<div id="eng-app"></div>
<style>
  #eng-app {
    --bg: #fbf6ee;
    --card: #fffaf2;
    --ink: #4a3b30;
    --ink-soft: #8a7a6a;
    --accent: #d97a52;
    --accent-soft: #f1c6a8;
    --good: #7a9a6e;
    --good-bg: rgba(122,154,110,0.12);
    --bad: #c4654f;
    --bad-bg: rgba(196,101,79,0.1);
    --tip: #c79a3a;
    --tip-bg: rgba(199,154,58,0.12);
    --border: rgba(74,59,48,0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #fdf2e3 0%, #fbf6ee 60%, #f7ecdd 100%);
    border-radius: 20px;
    padding: 32px;
    max-width: 840px;
    margin: 20px auto;
    box-sizing: border-box;
  }
  #eng-app * { box-sizing: border-box; }
  .eng-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:20px; flex-wrap: wrap; }
  .eng-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .eng-sub { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .eng-badge {
    background: rgba(255,255,255,0.55); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 14px; font-size: 13px; text-align: right; min-width: 130px;
  }
  .eng-badge b { font-size: 18px; display:block; color: var(--accent); }
  .eng-card {
    background: rgba(255,255,255,0.68); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; margin-bottom: 22px;
    box-shadow: 0 4px 20px rgba(74,59,48,0.06);
  }
  .eng-section-title { font-size: 17px; font-weight: 800; margin: 0 0 14px; display:flex; align-items:center; gap:8px; color: var(--accent); }
  .eng-section-sub { font-size: 13px; color: var(--ink-soft); margin: -4px 0 16px; font-weight: 500; }

  .eng-flash-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .eng-flash {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 12px; text-align: center; cursor: pointer;
    min-height: 100px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: transform 0.15s ease, border-color 0.15s ease; user-select: none;
  }
  .eng-flash:hover { transform: translateY(-2px); border-color: var(--accent-soft); }
  .eng-flash .front { font-weight: 700; font-size: 14px; }
  .eng-pos { font-size: 11px; color: var(--accent); font-weight: 600; font-style: italic; margin-left: 4px; }
  .eng-flash .ipa { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .eng-flash .back { display:none; font-size: 12px; color: var(--ink-soft); margin-top:4px; }
  .eng-flash.flipped .front { color: var(--accent); }
  .eng-flash.flipped .back { display:block; }
  .eng-example { font-size: 11px; color: var(--ink-soft); font-style: italic; margin-top: 4px; display:none; text-align:center; }
  .eng-flash.flipped .eng-example { display:block; }
  .eng-speak {
    position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%;
    border: none; background: rgba(217,122,82,0.12); color: var(--accent);
    font-size: 12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .eng-speak:hover { background: rgba(217,122,82,0.22); }

  .eng-formula-box {
    background: rgba(255,255,255,0.7);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 12px 0 16px;
    font-size: 13px;
    line-height: 1.7;
  }
  .eng-formula-title { font-weight: 800; color: var(--accent); font-size: 15px; margin-bottom: 8px; }

  .eng-grammar-ex { background: rgba(217,122,82,0.08); border-radius: 10px; padding: 12px 16px; margin-top: 10px; font-size: 13px; line-height:1.7; }
  .eng-mistake { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .eng-mistake-box { flex:1; min-width:220px; border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .eng-mistake-box.wrong { background: var(--bad-bg); }
  .eng-mistake-box.right { background: var(--good-bg); }
  .eng-mistake-box b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:4px; }
  .eng-mistake-box.wrong b { color: var(--bad); }
  .eng-mistake-box.right b { color: var(--good); }
  .eng-tip-box { margin-top: 12px; background: var(--tip-bg); border-radius: 10px; padding: 12px 14px; font-size: 13px; display:flex; gap:8px; line-height:1.6; }

  .eng-dialogue-line { display:flex; gap:12px; margin-bottom: 14px; align-items:flex-start; }
  .eng-dialogue-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--ink);
    display:flex; align-items:center; justify-content:center; font-size: 13px; font-weight:700; flex-shrink:0;
  }
  .eng-dialogue-bubble { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; flex:1; }
  .eng-dialogue-en { font-size: 14px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .eng-dialogue-vi { font-size: 12px; color: var(--ink-soft); margin-top: 4px; display:none; }
  .eng-dialogue-vi.show { display:block; }
  .eng-toggle-vi { background:none; border:none; color: var(--accent); font-size:13px; cursor:pointer; text-decoration:underline; padding:0; margin-top:8px; font-weight:600; }

  .eng-ex-block { margin-bottom: 26px; }
  .eng-ex-block:last-child { margin-bottom: 0; }
  .eng-quiz-q { margin-bottom: 16px; }
  .eng-quiz-q p { font-weight: 600; margin: 0 0 8px; font-size: 14px; }
  .eng-opt {
    display:block; width:100%; text-align:left; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; cursor:pointer; font-size: 14px; color: var(--ink);
  }
  .eng-opt:hover { border-color: var(--accent-soft); }
  .eng-opt.selected { border-color: var(--accent); background: rgba(217,122,82,0.1); }
  .eng-opt.correct { border-color: var(--good); background: var(--good-bg); }
  .eng-opt.wrong { border-color: var(--bad); background: var(--bad-bg); }

  .eng-fill-input {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 14px;
    width: 160px; background: var(--card); color: var(--ink); font-family: inherit;
  }
  .eng-fill-input.correct { border-color: var(--good); background: var(--good-bg); }
  .eng-fill-input.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .eng-fill-hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  .eng-build-pool, .eng-build-answer {
    display:flex; flex-wrap:wrap; gap:8px; min-height: 44px; padding: 8px;
    border-radius: 10px; border: 1px dashed var(--border);
  }
  .eng-build-answer { background: rgba(255,255,255,0.4); margin-bottom: 8px; }
  .eng-build-word {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font-size: 14px; cursor: pointer; user-select:none;
  }
  .eng-build-word:hover { border-color: var(--accent-soft); }
  .eng-build-word.used { opacity: 0.35; cursor: default; }
  .eng-build-result { font-size: 12px; margin-top: 6px; font-weight:600; }
  .eng-build-result.correct { color: var(--good); }
  .eng-build-result.wrong { color: var(--bad); }

  .eng-btn {
    background: var(--accent); color: white; border: none; border-radius: 12px;
    padding: 12px 26px; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .eng-btn:hover { opacity: 0.92; }
  .eng-btn.ghost { background: rgba(217,122,82,0.12); color: var(--accent); }
  .eng-result { margin-top: 16px; padding: 16px; border-radius: 12px; background: var(--good-bg); font-size: 15px; display:none; font-weight:700; text-align:center; }

  .eng-nav {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    margin-top: 16px; flex-wrap: wrap;
  }
  .eng-nav-link {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-width: 120px; border-radius: 12px; padding: 10px 18px;
    background: rgba(217,122,82,0.12); color: var(--accent); text-decoration:none;
    font-size: 13px; font-weight: 700; border: 1px solid rgba(217,122,82,0.18);
  }
  .eng-nav-link:hover { background: rgba(217,122,82,0.2); }
  .eng-nav-link.primary { background: var(--accent); color: #fff; }
</style>

<script>
(function(){
    const lessonData = {
    session: 6,
    title: "Bài 6: Động từ chỉ sở thích + V-ing / to V",
    vocab: [
      { en: "adore", pos: "v", ipa: "/əˈdɔːr/", vi: "thích cực kỳ, say mê", example: "I adore playing computer games." },
      { en: "fancy", pos: "v", ipa: "/ˈfænsi/", vi: "thích", example: "Do you fancy going to the cinema?" },
      { en: "detest", pos: "v", ipa: "/dɪˈtest/", vi: "ghét cay ghét đắng", example: "She detests washing the dishes." },
      { en: "mind", pos: "v", ipa: "/maɪnd/", vi: "phiền, ngại", example: "I don't mind helping you." },
      { en: "leisure", pos: "n", ipa: "/ˈleʒər/", vi: "thời gian rảnh rỗi", example: "In my leisure time, I read books." },
      { en: "addicted", pos: "adj", ipa: "/əˈdɪktɪd/", vi: "nghiện", example: "He is addicted to social media." },
      { en: "hooked", pos: "adj", ipa: "/hʊkt/", vi: "cuốn hút, đam mê", example: "I am hooked on this new TV series." }
    ],
    grammar: {
      point: "ĐỘNG TỪ CHỈ SỞ THÍCH (Verbs of Liking) + V-ing / to V",
      explanation: `
        <div class="eng-formula-box">
          <div class="eng-formula-title">1. Nhóm Động Từ + V-ing</div>
          <b>• Yêu thích:</b> enjoy, fancy, adore, love, like<br/>
          <b>• Ghét/Không thích:</b> detest, hate, dislike<br/>
          <b>• Không bận tâm:</b> don't mind<br/>
          <i>Ví dụ: I adore <b>listening</b> to music. / She detests <b>doing</b> homework.</i>
        </div>
        <div class="eng-formula-box">
          <div class="eng-formula-title">2. Nhóm Động Từ + To V (Hoặc cả 2)</div>
          <b>• Cả V-ing và to V (Không đổi nghĩa):</b> love, like, hate, prefer<br/>
          <i>Ví dụ: I like <b>to read</b> = I like <b>reading</b>.</i><br/>
          <b>• Cấu trúc "would like / would love":</b> BẮT BUỘC dùng <b>to V</b>.<br/>
          <i>Ví dụ: I would like <b>to drink</b> some water. (KHÔNG dùng drinking)</i>
        </div>
      `,
      examples: [
        "She fancies <b>going</b> out with friends.",
        "I wouldn't mind <b>waiting</b> a few minutes."
      ],
      commonMistake: {
        wrong: "I enjoy to play football.",
        right: "I enjoy **playing** football.",
        note: "Sau 'enjoy', 'fancy', 'detest', 'mind' LUÔN LUÔN là V-ing!"
      },
      memoryTip: "Nhớ câu thần chú V-ing: 'Thích (adore, fancy), Ghét (detest), và Không màng (mind)'."
    },
    dialogue: {
      titleVi: "Tình huống: Trò chuyện về sở thích cuối tuần",
      lines: [
        { speaker: "Lan", en: "What do you fancy doing this weekend?", vi: "Bạn thích làm gì cuối tuần này?" },
        { speaker: "Minh", en: "I adore playing football, but it's going to rain. I don't mind staying at home.", vi: "Mình cực thích đá bóng, nhưng trời sắp mưa. Mình không ngại ở nhà đâu." },
        { speaker: "Lan", en: "I detest staying indoors. Do you want to go to the cinema?", vi: "Mình ghét cay ghét đắng việc ở rịt trong nhà. Bạn muốn đi xem phim không?" },
        { speaker: "Minh", en: "I would love to go! Let's watch a comedy.", vi: "Mình rất muốn đi! Hãy xem một bộ phim hài nhé." }
      ]
    },
    exercises: {
      multipleChoice: [
        { q: "My sister fancies ___ clothes online.", options: ["buying", "to buy", "buy"], answer: "buying" },
        { q: "We don't mind ___ late to finish the project.", options: ["working", "to work", "work"], answer: "working" },
        { q: "Tom detests ___ his room. It's always messy.", options: ["cleaning", "to clean", "cleans"], answer: "cleaning" },
        { q: "I would like ___ a cup of tea, please.", options: ["to have", "having", "have"], answer: "to have" },
        { q: "Are you hooked ___ playing computer games?", options: ["in", "on", "at"], answer: "on" },
        { q: "Many teenagers are addicted ___ their smartphones.", options: ["with", "to", "for"], answer: "to" },
        { q: "She adores ___ with her friends at the weekend.", options: ["hanging out", "to hang out", "hang out"], answer: "hanging out" },
        { q: "I prefer ___ to reading books.", options: ["watching TV", "watch TV", "to watch TV"], answer: "watching TV" },
        { q: "They hate ___ up early in the winter.", options: ["waking", "wake", "woke"], answer: "waking" },
        { q: "Would you love ___ to my party tonight?", options: ["to come", "coming", "come"], answer: "to come" }
      ],
      fillBlank: [
        { sentence: "Do you enjoy ___ (listen) to pop music?", answer: "listening" },
        { sentence: "He detests ___ (wash) the dishes after dinner.", answer: "washing" },
        { sentence: "I don't mind ___ (wait) for you if you're late.", answer: "waiting" },
        { sentence: "She would like ___ (travel) around the world.", answer: "to travel" },
        { sentence: "My brother is addicted ___ (play) video games.", answer: "to playing" },
        { sentence: "We fancy ___ (eat) out tonight.", answer: "eating" },
        { sentence: "I adore ___ (collect) stamps from different countries.", answer: "collecting" },
        { sentence: "Would they prefer ___ (stay) at home or go out?", answer: "to stay" }
      ],
      transformation: [
        { sentence: "I like reading comics very much. (adore)", answer: "I adore reading comics." },
        { sentence: "She hates doing the laundry. (detests)", answer: "She detests doing the laundry." },
        { sentence: "Do you want to go for a walk? (fancy)", answer: "Do you fancy going for a walk?" },
        { sentence: "He is a big fan of K-pop. (hooked)", answer: "He is hooked on K-pop." },
        { sentence: "I want to have a pizza. (would like)", answer: "I would like to have a pizza." }
      ],
      review: [
        { sentence: "By this time tomorrow, they ___ (finish) their final exam.", answer: "will have finished" },
        { sentence: "We ___ (know) each other since we were in primary school.", answer: "have known" },
        { sentence: "What ___ you ___ (do) when the phone rang?", answer: "were doing" },
        { sentence: "Look at the dark clouds! It ___ (rain).", answer: "is going to rain" },
        { sentence: "My parents ___ (buy) a new car last week.", answer: "bought" }
      ],
      sentenceBuild: [
        { words: ["I", "fancy", "reading", "books", "in", "my", "leisure", "time", "."], answer: "I fancy reading books in my leisure time ." },
        { words: ["She", "detests", "making", "models", "because", "it", "is", "boring", "."], answer: "She detests making models because it is boring ." },
        { words: ["We", "don't", "mind", "helping", "you", "with", "your", "homework", "."], answer: "We don't mind helping you with your homework ." },
        { words: ["Are", "you", "hooked", "on", "watching", "TV", "series", "?"], answer: "Are you hooked on watching TV series ?" },
        { words: ["I", "would", "like", "to", "drink", "some", "orange", "juice", "."], answer: "I would like to drink some orange juice ." },
        { words: ["He", "adores", "hanging", "out", "with", "his", "best", "friends", "."], answer: "He adores hanging out with his best friends ." },
        { words: ["My", "brother", "is", "addicted", "to", "social", "media", "."], answer: "My brother is addicted to social media ." }
      ]
    }
  };
  const KEY_STREAK = "eng:streak";
  const KEY_DAYS = "eng:completed-days";
  const dayId = `g8-s${lessonData.session}`;
  const ttsOk = typeof window.speechSynthesis !== "undefined";

  function speak(text) {
    if (!ttsOk) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.92;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  const app = document.getElementById("eng-app");

  function speakBtn(text) {
    return ttsOk ? `<button class="eng-speak" data-speak="${text.replace(/"/g, '&quot;')}" title="Nghe đọc">🔊</button>` : "";
  }

  function flashHtml(v, i) {
    return `<div class="eng-flash" data-i="${i}">
      ${speakBtn(v.en)}
      <div class="front">${v.en} ${v.pos ? `<span class="eng-pos">(${v.pos})</span>` : ""}</div>
      ${v.ipa ? `<div class="ipa">${v.ipa}</div>` : ""}
      <div class="back">${v.vi}</div>
      <div class="eng-example">"${v.example}"</div>
    </div>`;
  }

  function dialogueHtml(d) {
    return d.lines.map((line, i) => `
      <div class="eng-dialogue-line">
        <div class="eng-dialogue-avatar">${line.speaker}</div>
        <div class="eng-dialogue-bubble">
          <div class="eng-dialogue-en">${line.en} ${speakBtn(line.en)}</div>
          <div class="eng-dialogue-vi" data-vi="${i}">${line.vi}</div>
        </div>
      </div>`).join("") + `<button class="eng-toggle-vi" id="eng-toggle-vi">Hiện nghĩa tiếng Việt</button>`;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function normalize(s) {
    return s.toLowerCase().replace(/[.?!,]/g, "").trim().replace(/\s+/g, " ");
  }

  function navHtml() {
    const s = lessonData.session;
    const prevHref = s === 1 ? "index.html" : `english-g8-s${s-1}.html`;
    const nextHref = s === 5 ? "index.html" : `english-g8-s${s+1}.html`;
    const nextLabel = s === 5 ? "Về trang chủ" : "Bài tiếp →";

    return `<div class="eng-nav">
      <a class="eng-nav-link" href="${prevHref}">← Quay lại</a>
      <a class="eng-nav-link" href="index.html">Trang chủ</a>
      <a class="eng-nav-link primary" href="${nextHref}">${nextLabel}</a>
    </div>`;
  }

  function render() {
    const streak = parseInt(localStorage.getItem(KEY_STREAK) || "1");
    const completedDays = JSON.parse(localStorage.getItem(KEY_DAYS) || "[]");
    const completedCount = completedDays.length;

    const ex = lessonData.exercises;

    app.innerHTML = `
      <div class="eng-header">
        <div>
          <p class="eng-title">Grade 8 · Bài ${lessonData.session}: ${lessonData.title}</p>
          <p class="eng-sub">${lessonData.titleEn}</p>
        </div>
        <div class="eng-badge">Streak<b>${streak} 🔥</b>Đã học ${completedCount} bài</div>
      </div>

      <div class="eng-card">
        <p class="eng-section-title">📇 16 Từ vựng trọng tâm (bấm để lật thẻ, bấm 🔊 để nghe)</p>
        <div class="eng-flash-grid">${lessonData.vocab.map(flashHtml).join("")}</div>
      </div>

      <div class="eng-card">
        <p class="eng-section-title">📘 Ngữ pháp: ${lessonData.grammar.point}</p>
        <div>${lessonData.grammar.explanation}</div>
        <div class="eng-grammar-ex">${lessonData.grammar.examples.join("<br/>")}</div>
        ${lessonData.grammar.commonMistake ? `
        <div class="eng-mistake">
          <div class="eng-mistake-box wrong"><b>❌ Sai thường gặp</b>${lessonData.grammar.commonMistake.wrong}</div>
          <div class="eng-mistake-box right"><b>✅ Đúng</b>${lessonData.grammar.commonMistake.right}</div>
        </div>
        <p class="eng-section-sub" style="margin-top:8px;">${lessonData.grammar.commonMistake.note}</p>` : ""}
        ${lessonData.grammar.memoryTip ? `<div class="eng-tip-box">💡 ${lessonData.grammar.memoryTip}</div>` : ""}
      </div>

      ${lessonData.dialogue ? `
      <div class="eng-card">
        <p class="eng-section-title">💬 Hội thoại thực tế mở rộng (8 lượt thoại)</p>
        <p class="eng-section-sub">${lessonData.dialogue.titleVi}</p>
        ${dialogueHtml(lessonData.dialogue)}
      </div>` : ""}

      <div class="eng-card">
        <p class="eng-section-title">✏️ Bài tập chuyên sâu (25 Câu)</p>

        ${ex.multipleChoice && ex.multipleChoice.length ? `
        <div class="eng-ex-block">
          <p class="eng-section-sub">Phần 1 · Trắc nghiệm ngữ pháp & từ vựng (10 câu)</p>
          <div id="eng-mc"></div>
        </div>` : ""}

        ${ex.fillBlank && ex.fillBlank.length ? `
        <div class="eng-ex-block">
          <p class="eng-section-sub">Phần 2 · Chia động từ đúng theo công thức (8 câu)</p>
          <div id="eng-fill"></div>
        </div>` : ""}

        ${ex.sentenceBuild && ex.sentenceBuild.length ? `
        <div class="eng-ex-block">
          <p class="eng-section-sub">Phần 3 · Ghép câu hoàn chỉnh (7 câu)</p>
          <div id="eng-build"></div>
        </div>` : ""}

        ${ex.transformation && ex.transformation.length ? `
        <div class="eng-ex-block">
          <p class="eng-section-sub">Phần 4 · Viết lại câu (Sentence Transformation)</p>
          <div id="eng-transform"></div>
        </div>` : ""}

        ${ex.review && ex.review.length ? `
        <div class="eng-ex-block" style="background: rgba(217,122,82,0.05); border-color: rgba(217,122,82,0.2);">
          <p class="eng-section-sub" style="color: #c56842;">Phần 5 · Ôn tập bài cũ (Spaced Repetition)</p>
          <div id="eng-review"></div>
        </div>` : ""}


        <button class="eng-btn" id="eng-submit">Kiểm tra kết quả 35 câu</button>
        <div class="eng-result" id="eng-result"></div>
      </div>

      ${navHtml()}
    `;

    // event listeners
    app.querySelectorAll("[data-speak]").forEach(btn => {
      btn.addEventListener("click", (e) => { e.stopPropagation(); speak(btn.dataset.speak); });
    });

    app.querySelectorAll(".eng-flash").forEach(el => {
      el.addEventListener("click", (e) => {
        if (e.target.closest(".eng-speak")) return;
        el.classList.toggle("flipped");
      });
    });

    const toggleBtn = document.getElementById("eng-toggle-vi");
    if (toggleBtn) {
      let shown = false;
      toggleBtn.addEventListener("click", () => {
        shown = !shown;
        app.querySelectorAll(".eng-dialogue-vi").forEach(el => el.classList.toggle("show", shown));
        toggleBtn.textContent = shown ? "Ẩn nghĩa tiếng Việt" : "Hiện nghĩa tiếng Việt";
      });
    }

    // Multiple Choice
    const mcSelections = {};
    const mcBox = document.getElementById("eng-mc");
    if (mcBox) {
      ex.multipleChoice.forEach((q, qi) => {
        const block = document.createElement("div");
        block.className = "eng-quiz-q";
        block.innerHTML = `<p>${qi + 1}. ${q.q}</p>` +
          q.options.map(opt => `<button class="eng-opt" data-qi="${qi}" data-opt="${opt}">${opt}</button>`).join("");
        mcBox.appendChild(block);
      });
      mcBox.querySelectorAll(".eng-opt").forEach(btn => {
        btn.addEventListener("click", () => {
          const qi = btn.dataset.qi;
          mcBox.querySelectorAll(`.eng-opt[data-qi="${qi}"]`).forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
          mcSelections[qi] = btn.dataset.opt;
        });
      });
    }

    // Fill Blank
    const fillBox = document.getElementById("eng-fill");
    if (fillBox) {
      ex.fillBlank.forEach((q, qi) => {
        const parts = q.sentence.split("___");
        const block = document.createElement("div");
        block.className = "eng-quiz-q";
        block.innerHTML = `<p>${qi + 1}. ${parts[0]}<input class="eng-fill-input" data-qi="${qi}" type="text"/>${parts[1] || ""}</p>`;
        fillBox.appendChild(block);
      });
    }

    // Sentence Build
    const buildBox = document.getElementById("eng-build");
    const buildState = {};
    if (buildBox) {
      ex.sentenceBuild.forEach((q, qi) => {
        const wrap = document.createElement("div");
        wrap.className = "eng-quiz-q";
        wrap.innerHTML = `<p>${qi + 1}. Ghép từ thành câu:</p>
          <div class="eng-build-answer" id="eng-build-ans-${qi}"></div>
          <div class="eng-build-pool" id="eng-build-pool-${qi}"></div>
          <button class="eng-btn ghost" data-reset="${qi}" style="margin-top:6px; padding:6px 14px; font-size:12px;">Làm lại</button>
          <div class="eng-build-result" id="eng-build-result-${qi}"></div>`;
        buildBox.appendChild(wrap);
        buildState[qi] = { order: shuffle(q.words.map((w, wi) => ({ w, wi }))), used: new Set(), chosen: [] };
        renderBuildPool(qi);
      });

      function renderBuildPool(qi) {
        const pool = document.getElementById(`eng-build-pool-${qi}`);
        const ans = document.getElementById(`eng-build-ans-${qi}`);
        const st = buildState[qi];
        pool.innerHTML = st.order.map(item => `
          <button class="eng-build-word ${st.used.has(item.wi) ? 'used' : ''}" data-qi="${qi}" data-wi="${item.wi}">${item.w}</button>
        `).join("");
        ans.innerHTML = st.chosen.map(item => `
          <span class="eng-build-word">${item.w}</span>
        `).join("");

        pool.querySelectorAll(".eng-build-word:not(.used)").forEach(btn => {
          btn.addEventListener("click", () => {
            const wi = parseInt(btn.dataset.wi);
            const item = st.order.find(x => x.wi === wi);
            st.used.add(wi);
            st.chosen.push(item);
            renderBuildPool(qi);
          });
        });
      }

      buildBox.querySelectorAll("[data-reset]").forEach(btn => {
        btn.addEventListener("click", () => {
          const qi = btn.dataset.reset;
          buildState[qi].used.clear();
          buildState[qi].chosen = [];
          document.getElementById(`eng-build-result-${qi}`).textContent = "";
          renderBuildPool(qi);
        });
      });
    }

    // Submit
    document.getElementById("eng-submit").addEventListener("click", () => {
      let correct = 0;
      let total = 0;

      if (ex.multipleChoice) {
        ex.multipleChoice.forEach((q, qi) => {
          total++;
          const selected = mcSelections[qi];
          const btns = mcBox.querySelectorAll(`.eng-opt[data-qi="${qi}"]`);
          btns.forEach(b => {
            if (selected) {
              if (b.dataset.opt === q.answer) b.classList.add("correct");
              if (b.dataset.opt === selected && selected !== q.answer) b.classList.add("wrong");
            }
          });
          if (selected && selected === q.answer) {
            correct++;
          }
        });
      }

      if (ex.fillBlank) {
        ex.fillBlank.forEach((q, qi) => {
          total++;
          const input = fillBox ? fillBox.querySelector(`.eng-fill-input[data-qi="${qi}"]`) : null;
          const val = input ? input.value.trim().toLowerCase() : "";
          if (val && val === q.answer.toLowerCase()) {
            input.classList.add("correct");
            correct++;
          } else {
            if (input) {
              input.classList.add("wrong");
              if (!val) input.placeholder = `Chưa làm (${q.answer})`;
            }
          }
        });
      }

      if (ex.sentenceBuild) {
        ex.sentenceBuild.forEach((q, qi) => {
          total++;
          const st = buildState[qi];
          const userSentence = st && st.chosen ? st.chosen.map(x => x.w).join(" ") : "";
          const resEl = document.getElementById(`eng-build-result-${qi}`);
          if (userSentence && normalize(userSentence) === normalize(q.answer)) {
            if (resEl) {
              resEl.className = "eng-build-result correct";
              resEl.textContent = "✅ Chính xác!";
            }
            correct++;
          } else {
            if (resEl) {
              resEl.className = "eng-build-result wrong";
              resEl.textContent = !userSentence ? `❌ Chưa làm. Đáp án: "${q.answer}"` : `❌ Chưa đúng. Đáp án: "${q.answer}"`;
            }
          }
        });
      }

      
      if (ex.transformation) {
        const transBox = document.getElementById("eng-transform");
        ex.transformation.forEach((q, qi) => {
          total++;
          const input = transBox ? transBox.querySelector(`.trans-input[data-qi="${qi}"]`) : null;
          const val = input ? input.value.trim().toLowerCase() : "";
          const cleanVal = val.replace(/[.,!?]/g, '').replace(/\s+/g, ' ');
          const cleanAns = q.answer.toLowerCase().replace(/[.,!?]/g, '').replace(/\s+/g, ' ');
          if (cleanVal && cleanVal === cleanAns) {
            if (input) input.classList.add("correct");
            correct++;
          } else {
            if (input) {
              input.classList.add("wrong");
              if (!val) input.placeholder = `Chưa làm (${q.answer})`;
              else input.value = `${input.value} (Sai, đáp án: ${q.answer})`;
            }
          }
        });
      }

      if (ex.review) {
        const revBox = document.getElementById("eng-review");
        ex.review.forEach((q, qi) => {
          total++;
          const input = revBox ? revBox.querySelector(`.review-input[data-qi="${qi}"]`) : null;
          const val = input ? input.value.trim().toLowerCase() : "";
          if (val && val === q.answer.toLowerCase()) {
            if (input) input.classList.add("correct");
            correct++;
          } else {
            if (input) {
              input.classList.add("wrong");
              if (!val) input.placeholder = `Chưa làm (${q.answer})`;
            }
          }
        });
      }

      const resBox = document.getElementById("eng-result");
      resBox.style.display = "block";
      resBox.innerHTML = `Bạn đạt <b>${correct}/${total}</b> điểm! 🎉`;

      if (correct >= 25 && !completedDays.includes(dayId)) {
        completedDays.push(dayId);
        localStorage.setItem(KEY_DAYS, JSON.stringify(completedDays));
        localStorage.setItem(KEY_STREAK, (streak + 1).toString());
      }

      const scoreStr = `${correct}/${total} câu`;
      triggerAutoSync(`Nộp bài ${lessonData.title}`, scoreStr, lessonData.title);
    });

    function triggerAutoSync(exitReason, quizScore, quizTitle) {
      const name = localStorage.getItem('eng:student-name') || 'Học sinh chưa nhập tên';
      const completedDays = JSON.parse(localStorage.getItem(KEY_DAYS) || '[]');
      const streak = localStorage.getItem(KEY_STREAK) || '1';
      const now = new Date().toLocaleString('vi-VN');

      const payload = {
        name,
        lessonTitle: quizTitle || lessonData.title || "Bài 1",
        score: quizScore || `Đã pass ${completedDays.length}/5 bài`,
        completedCount: completedDays.length,
        completedDays,
        streak,
        timestamp: now,
        reason: exitReason || 'App Exit / Hide'
      };

      localStorage.setItem('eng:last-sync-snapshot', JSON.stringify(payload));
      localStorage.setItem('eng:last-sync-time', now);

      const DEFAULT_SYNC_URL = 'https://script.google.com/macros/s/AKfycbzVXmeXIu4Tf36Tjs9WiRyvtEB3WTxhSoReXyhqySDnze8aVaFTFW39em2cdfdzlWOR/exec';
      const syncUrl = localStorage.getItem('eng:sync-server-url') || DEFAULT_SYNC_URL;
      if (syncUrl) {
        fetch(syncUrl, {
          method: 'POST',
          body: JSON.stringify(payload),
          mode: 'no-cors'
        }).catch(() => {});
      }
    }
  }

  render();
})();
</script>
</body>
</html>
